name: Publish dashboard
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build_site.py'
      - 'config.json'
      # Airport and airline names and the tracker code the build uses.
      - 'tracker/**'
      - 'scripts/search_settings.py'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Track flights']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    # Only trusted default-branch code/state; never consume run artifacts or PR code.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      # A new copy has no tracker-state branch before its first search; only then
      # is an empty dashboard published. Any other lookup failure stops the build.
      - name: Look for stored price history
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api -i "repos/$GITHUB_REPOSITORY/branches/tracker-state" 2>/dev/null | head -1 | awk '{print $2}' || true)
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT"
                 echo "::notice::No search has run yet, so the dashboard is published without prices." ;;
            *) echo "Could not check the tracker-state branch (HTTP ${status:-error})"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.state.outputs.exists == 'true'
        with:
          ref: tracker-state
          path: state
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Test public data export and dashboard logic
        run: |
          python -m unittest discover -s tests -p test_site.py -v
          node --test tests/site_model.test.mjs tests/search_model.test.mjs
      # Settings saved through the website form replace config.json for this build.
      - name: Load search settings
        run: python scripts/search_settings.py use
      - name: Build allowlisted static files
        env:
          PUBLIC_TRACK_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python scripts/build_site.py ${{ steps.state.outputs.exists == 'false' && '--empty' || '' }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  # One message to the main channel when publishing starts failing, and one when it
  # works again; repeated failures stay quiet. Skipped and cancelled runs say nothing.
  report:
    needs: [build, deploy]
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Tell the message channel about a change
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ (needs.build.result == 'failure' || needs.deploy.result == 'failure') && 'failure' || 'success' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          NOTIFICATION_CHANNEL: ${{ vars.NOTIFICATION_CHANNEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # The latest finished run before this one that succeeded or failed; empty if unknown.
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pages.yml --status completed --limit 20 \
            --json databaseId,conclusion \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].conclusion // \"\"" \
            || true)
          python scripts/publish_status.py --result "$RESULT" --previous "$previous"
