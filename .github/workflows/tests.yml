name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/site_model.test.mjs tests/search_model.test.mjs
      - run: python -m tracker demo --as-of 2026-09-18
      - run: python -m tracker demo --as-of 2026-09-19 --demo-discount 100
      - run: python -m compileall -q tracker scripts
