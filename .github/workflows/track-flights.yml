name: Track flights
on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      baggage_only:
        description: 'Only refresh website baggage comparisons; no notifications'
        type: boolean
        default: false
permissions:
  contents: write  # save the history on the tracker-state branch
  actions: write   # start Publish dashboard after a search started by another workflow
concurrency:
  group: flight-tracker-persistent-state
  cancel-in-progress: false
jobs:
  track:
    if: vars.TRACKER_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Optional custom domain for links in messages; GitHub Pages is used otherwise.
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      # Settings saved through the website form replace config.json for this run.
      - name: Load search settings
        run: python scripts/search_settings.py use
      # Offline tests run in the Tests workflow on every push to main and PR.
      - name: Restore durable history
        id: restore
        run: python scripts/state_git.py restore
      - name: Search calendars and verify shortlisted itineraries
        id: scan
        if: inputs.baggage_only != true
        continue-on-error: true
        run: python -m tracker scan
      - name: Checkpoint history and pending alerts BEFORE delivery
        id: checkpoint
        if: always() && steps.restore.outcome == 'success' && steps.scan.outcome != 'skipped'
        run: python scripts/state_git.py save
      - name: Deliver pending notifications
        id: notify
        if: always() && steps.checkpoint.outcome == 'success'
        continue-on-error: true
        env:
          NOTIFICATION_CHANNEL: ${{ vars.NOTIFICATION_CHANNEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tracker notify
      - name: Persist delivery receipts even after a partial failure
        id: receipts
        if: always() && steps.checkpoint.outcome == 'success'
        run: python scripts/state_git.py save
      - name: Website baggage comparisons
        id: baggage
        if: always() && ((steps.receipts.outcome == 'success' && steps.scan.outcome == 'success') || (inputs.baggage_only == true && steps.restore.outcome == 'success'))
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/scan_baggage.py
      - name: Persist website baggage observations
        if: always() && steps.baggage.outcome != 'skipped' && steps.restore.outcome == 'success' && (steps.receipts.outcome == 'success' || inputs.baggage_only == true)
        run: python scripts/state_git.py save
      - name: Recovery snapshot
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flight-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/history.sqlite3
            state/latest.json
            state/latest.csv
            state/report.md
          if-no-files-found: warn
          retention-days: 7
      # "Publish dashboard" starts by itself after scheduled and manual runs. Runs started
      # by another workflow (settings form, catch-up) with the workflow token don't
      # trigger it, so start it here.
      - name: Publish the dashboard after a search started by another workflow
        if: always() && github.event_name == 'workflow_dispatch' && github.triggering_actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Surface partial scans or failed deliveries
        if: always() && (steps.scan.outcome == 'failure' || steps.notify.outcome == 'failure')
        run: |
          echo 'Tracking or delivery needs attention. See the run summary and recovery snapshot.'
          exit 1
