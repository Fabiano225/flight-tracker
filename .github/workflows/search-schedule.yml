name: Search schedule
# Starts Track flights about every 6 hours, robust against GitHub's late or skipped
# scheduled runs:
# - an external timer (e.g. cron-job.org, see DEPLOYMENT.md) starts this workflow at
#   fixed times; it searches unless the last search is less than 2 hours old, so the
#   fixed times hold even after a search started by hand or by the settings form;
# - an hourly check is the fallback; it searches when the last search is at least
#   6 h 30 min old, so it steps in only when the external timer did not.
# A search that is queued or running, or saved recently, is never started twice. "The
# last search" is that of the trip searched longest ago, so a search of only some trips
# (by hand or after a settings change) does not hold back the others.
# Catch-up: a trip whose latest search was incomplete (the source failed for a real part
# of it) is searched again on its own an hour later, at most twice in a row.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # start Track flights
jobs:
  check:
    if: vars.TRACKER_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start a search if the last one is old enough
        env:
          GH_TOKEN: ${{ github.token }}
          # Minutes since the last saved search before a new one starts.
          MIN_AGE: ${{ github.event_name == 'schedule' && '390' || '120' }}
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/track-flights.yml/runs?status=$status&per_page=1" --jq .total_count)
            if [ "$busy" != "0" ]; then
              echo "::notice::A search is $status; nothing to start."
              exit 0
            fi
          done
          # Every search saves latest.json on the tracker-state branch: each trip's latest
          # search, when it started and whether it was incomplete.
          if state=$(gh api "repos/$GITHUB_REPOSITORY/contents/latest.json?ref=tracker-state" \
                -H "Accept: application/vnd.github.raw" 2>"$RUNNER_TEMP/error"); then
            last=$(jq -r '[(.trips // [.])[] | .started] | min // empty' <<<"$state")
            age=$(( ( $(date -u +%s) - $(date -u -d "${last:-@0}" +%s) ) / 60 ))
            if [ "$age" -lt "$MIN_AGE" ]; then
              # Trips whose incomplete search is at least an hour old, at most twice in a row.
              retry=$(jq -r --argjson now "$(date -u +%s)" '[(.trips // [.])[]
                | select(.incomplete == true and (.incomplete_in_row // 1) <= 2
                         and $now - (.started | sub("\\+00:00$"; "Z") | fromdateiso8601) >= 3600)
                | .trip] | unique | join(",")' <<<"$state")
              if [ -n "$retry" ]; then
                echo "::notice::The latest search of $retry was incomplete. Searching it again."
                gh workflow run track-flights.yml --repo "$GITHUB_REPOSITORY" --ref main -f trips="$retry"
                exit 0
              fi
              echo "::notice::Every trip was searched within the last $age minutes (a new search starts from $MIN_AGE); nothing to start."
              exit 0
            fi
            echo "::notice::A trip was last searched $age minutes ago. Starting a search."
          elif grep -q "HTTP 404" "$RUNNER_TEMP/error"; then
            echo "::notice::No search has been saved yet. Starting the first one."
          else
            cat "$RUNNER_TEMP/error"
            exit 1
          fi
          gh workflow run track-flights.yml --repo "$GITHUB_REPOSITORY" --ref main
